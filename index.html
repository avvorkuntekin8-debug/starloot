<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarLoot - Kazandır!</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://adsgram.ai/sdk-v1.js"></script>

<style>
:root {
    --primary: #f39c12;
    --bg: #0a0a0a;
    --card: #141414;
}

body {
    background: radial-gradient(circle at top, #111, #000);
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

.container {
    background: var(--card);
    padding: 25px;
    border-radius: 20px;
    width: 90%;
    max-width: 350px;
    text-align: center;
    border: 1px solid #222;
    box-shadow: 0 0 30px rgba(243,156,18,0.2);
}

.logo {
    font-size: 55px;
    text-shadow: 0 0 20px var(--primary);
}

h1 {
    margin: 10px 0;
}

.score-box {
    background: rgba(243,156,18,0.08);
    border: 1px solid rgba(243,156,18,0.3);
    border-radius: 15px;
    padding: 15px;
    margin: 20px 0;
}

.score-value {
    font-size: 30px;
    color: var(--primary);
    font-weight: bold;
}

.btn {
    background: linear-gradient(45deg, #ff8c00, #ffb347);
    border: none;
    padding: 16px;
    width: 100%;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 0 15px rgba(255,140,0,0.4);
}

.btn:active {
    transform: scale(0.95);
}

.status {
    font-size: 12px;
    color: #888;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">
    <div class="logo">⭐</div>
    <h1>StarLoot</h1>

    <div class="score-box">
        <div>Toplam Kazanç</div>
        <div class="score-value" id="puan">0</div>
    </div>

    <button class="btn" id="adBtn">📺 Reklam İzle</button>
    <div class="status" id="status">Hazır</div>
</div>

<script>
// TELEGRAM INIT
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// PUAN
let puan = parseInt(localStorage.getItem("puan") || "0");
document.getElementById("puan").innerText = puan;

// ADSGRAM INIT (DOĞRU KULLANIM)
let AdController;

try {
    AdController = window.Adsgram.init({
        blockId: 29014, // STRING DEĞİL NUMBER OLMASI DAHA SAĞLAM
        debug: true
    });
    console.log("Adsgram hazır");
} catch (e) {
    console.error("Adsgram init hatası:", e);
}

// REKLAM
document.getElementById("adBtn").addEventListener("click", async () => {

    const btn = document.getElementById("adBtn");
    const status = document.getElementById("status");

    btn.disabled = true;
    status.innerText = "Reklam yükleniyor...";

    try {
        // REKLAMI GÖSTER
        await AdController.show();

        // BAŞARILI
        puan += 100;
        localStorage.setItem("puan", puan);
        document.getElementById("puan").innerText = puan;

        status.innerText = "✔ 100 puan kazandın!";
        tg.HapticFeedback.notificationOccurred("success");

    } catch (err) {

        console.error(err);

        status.innerText = "❌ Reklam yok / hata";

        tg.showAlert("Şu anda reklam bulunamadı. Biraz sonra tekrar dene.");
    }

    btn.disabled = false;
});
</script>

</body>
</html>

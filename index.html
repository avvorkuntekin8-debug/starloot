<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earn Clicker PRO</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://adsgram.ai/sdk-v1.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"></script>

<style>
body {
    margin:0;
    background:#0a0a0a;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box {
    width:90%;
    max-width:350px;
    background:#111;
    border-radius:20px;
    padding:20px;
    text-align:center;
    box-shadow:0 0 40px rgba(255,150,0,0.2);
}

.btn {
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:linear-gradient(45deg,orange,gold);
    font-weight:bold;
}

.score {
    font-size:28px;
    color:orange;
}
</style>
</head>

<body>

<div class="box">
    <h2>⭐ Earn PRO</h2>

    <div class="score" id="puan">0</div>
    <div id="level">Level 1</div>

    <button class="btn" onclick="tikla()">Tıkla</button>
    <button class="btn" onclick="reklam()">Reklam İzle</button>
    <button class="btn" onclick="referans()">Referans Link</button>

    <div id="status">Hazır</div>
</div>

<script>
// TELEGRAM
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const user = tg.initDataUnsafe.user;
const userId = user ? user.id : Math.floor(Math.random()*999999);

// FIREBASE CONFIG (BURAYI DOLDUR)
const firebaseConfig = {
    apiKey: "API_KEY",
    authDomain: "PROJECT.firebaseapp.com",
    databaseURL: "https://PROJECT.firebaseio.com",
    projectId: "PROJECT"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// DATA
let puan = 0;
let level = 1;
let clickValue = 1;
let lastAd = 0;

// KULLANICI YÜKLE
function loadUser(){
    db.ref("users/"+userId).once("value").then(snap=>{
        if(snap.exists()){
            let d = snap.val();
            puan = d.puan || 0;
            level = d.level || 1;
            clickValue = d.click || 1;
        }else{
            db.ref("users/"+userId).set({
                puan:0,
                level:1,
                click:1,
                ref: tg.initDataUnsafe.start_param || null
            });

            // REFERANS BONUS
            if(tg.initDataUnsafe.start_param){
                db.ref("users/"+tg.initDataUnsafe.start_param+"/puan")
                .transaction(p=> (p||0)+200);
            }
        }
        updateUI();
    });
}

// SAVE
function save(){
    db.ref("users/"+userId).update({
        puan, level, click: clickValue
    });
}

// CLICK
function tikla(){
    puan += clickValue;

    let newLevel = Math.floor(puan / 500)+1;
    if(newLevel > level){
        level = newLevel;
        clickValue++;
        alert("Level atladın 🚀");
    }

    save();
    updateUI();
}

// ADSGRAM
let AdController = window.Adsgram.init({
    blockId: 29014,
    debug:true
});

// REKLAM
async function reklam(){

    let now = Date.now();

    if(now - lastAd < 60000){
        status.innerText="Bekle...";
        return;
    }

    try{
        let can = await AdController.canShow();

        if(!can){
            status.innerText="Reklam yok 😢";
            return;
        }

        await AdController.show();

        puan += 100;
        lastAd = now;

        save();
        updateUI();

    }catch(e){
        console.log(e);
    }
}

// REFERANS
function referans(){
    let link = "https://t.me/SENINBOTUN?startapp="+userId;
    tg.showAlert(link);
}

// UI
function updateUI(){
    document.getElementById("puan").innerText = puan;
    document.getElementById("level").innerText = "Level "+level;
}

// BAŞLAT
loadUser();

</script>

</body>
</html>

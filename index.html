<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://adsgram.ai/sdk-v1.js"></script>
    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: sans-serif; padding-top: 50px; }
        .btn { background: #f39c12; color: white; padding: 20px; border-radius: 15px; border: none; font-size: 20px; }
    </style>
</head>
<body>
    <h1>⭐ STARLOOT ⭐</h1>
    <div id="game" style="display: block;">
        <p>Puan: <span id="p">0</span></p>
        <button class="btn" onclick="izle()">REKLAM İZLE</button>
    </div>

    <script>
        // Telegram'ı zorla başlat
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const AdController = window.Adsgram.init({ blockId: "29014" });

        function izle() {
            AdController.show().then(() => {
                alert("Tebrikler!");
            }).catch(() => {
                alert("Reklam şu an yok.");
            });
        }
    </script>
</body>
</html>

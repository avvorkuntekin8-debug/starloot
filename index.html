<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarLoot - Para Kazan</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://adsgram.ai/sdk.js"></script> <!-- Reklam Sistemi -->
    <style>
        body { background: #0f0f0f; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        .balance-card { background: linear-gradient(45deg, #0088cc, #005580); padding: 20px; border-radius: 20px; margin-bottom: 20px; }
        .btn { background: #f39c12; color: white; padding: 15px 30px; border: none; border-radius: 50px; font-size: 18px; cursor: pointer; font-weight: bold; width: 80%; }
        .stars { font-size: 24px; color: #ffd700; }
    </script>
</head>
<body>
    <div class="balance-card">
        <h3>Mevcut Bakiyen</h3>
        <div class="stars"><span id="score">0</span> 🌟 StarPuan</div>
    </div>

    <button class="btn" onclick="showAd()">Reklam İzle & Puan Kazan</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Adsgram Reklam Ayarı (Blok ID'ni buraya yazacağız)
        const AdController = window.Adsgram.init({ blockId: "29014" });

        function showAd() {
            AdController.show().then((result) => {
                // Reklam başarıyla izlendiğinde
                let score = document.getElementById("score");
                score.innerText = parseInt(score.innerText) + 50;
                tg.showAlert("Tebrikler! 50 Puan kazandın.");
            }).catch((result) => {
                // Reklam izlenmediyse veya hata oluştuysa
                tg.showAlert("Reklam yüklenemedi, lütfen tekrar dene.");
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://adsgram.ai/sdk-v1.js"></script>
    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: sans-serif; padding-top: 50px; }
        .btn { background: #f39c12; color: white; padding: 20px; border-radius: 15px; border: none; font-size: 20px; }
    </style>
</head>
<body>
    <h1>⭐ STARLOOT ⭐</h1>
    <div id="game" style="display: block;">
        <p>Puan: <span id="p">0</span></p>
        <button class="btn" onclick="izle()">REKLAM İZLE</button>
    </div>

    <script>
        function izle() {
            console.log("Reklam isteği gönderildi...");
            AdController.show().then(() => {
                // Reklam başarıyla izlendiğinde burası çalışır
                alert("Reklam başarıyla izlendi! Puanın eklendi.");
                let puanElement = document.getElementById('p');
                puanElement.innerText = parseInt(puanElement.innerText) + 10;
            }).catch((error) => {
                // Reklam yüklenemezse veya kullanıcı kapatırsa burası çalışır
                console.error("Reklam Hatası:", error);
                alert("Reklam şu an hazır değil veya hata oluştu. Hata: " + JSON.stringify(error));
            });
        }
    </script>
</body>
</html>

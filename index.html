<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earn Clicker</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://adsgram.ai/sdk-v1.js"></script>

<style>
body {
    margin:0;
    font-family:Arial;
    background: radial-gradient(circle,#0f0f0f,#000);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container {
    width:90%;
    max-width:350px;
    background:#111;
    border-radius:20px;
    padding:20px;
    text-align:center;
    box-shadow:0 0 30px rgba(255,150,0,0.2);
}

.logo {
    font-size:50px;
    text-shadow:0 0 15px orange;
}

.score {
    font-size:30px;
    color:orange;
    margin:10px 0;
}

.level {
    font-size:14px;
    color:#aaa;
}

.btn {
    margin-top:10px;
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    background:linear-gradient(45deg,orange,gold);
    cursor:pointer;
}

.btn:active { transform:scale(0.95); }

.status {
    font-size:12px;
    color:#888;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">
    <div class="logo">⭐</div>
    <h2>Earn Clicker</h2>

    <div class="score" id="puan">0</div>
    <div class="level" id="level">Level 1</div>

    <button class="btn" onclick="tikla()">🖱️ Tıkla</button>
    <button class="btn" onclick="reklam()">📺 Reklam İzle (+100)</button>

    <div class="status" id="status">Hazır</div>
</div>

<script>
// TELEGRAM
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// DATA
let puan = parseInt(localStorage.getItem("puan") || "0");
let level = parseInt(localStorage.getItem("level") || "1");
let clickValue = parseInt(localStorage.getItem("clickValue") || "1");
let lastAd = parseInt(localStorage.getItem("lastAd") || "0");
let dailyAds = parseInt(localStorage.getItem("dailyAds") || "0");

updateUI();

// ADSGRAM
let AdController;
try {
    AdController = window.Adsgram.init({
        blockId: 29014,
        debug: true
    });
} catch(e){
    console.log(e);
}

// CLICK
function tikla(){
    puan += clickValue;
    checkLevel();
    save();
    updateUI();
}

// LEVEL SYSTEM
function checkLevel(){
    let newLevel = Math.floor(puan / 500) + 1;

    if(newLevel > level){
        level = newLevel;
        clickValue += 1;
        tg.HapticFeedback.notificationOccurred("success");
        alert("Level atladın! 🚀");
    }
}

// REKLAM
async function reklam(){

    let status = document.getElementById("status");
    let now = Date.now();

    if(now - lastAd < 60000){
        status.innerText = "⏳ 1 dakika bekle";
        return;
    }

    status.innerText = "Reklam aranıyor...";

    try{

        let canShow = await AdController.canShow();

        if(!canShow){
            status.innerText = "😢 Reklam yok, tıkla!";
            return;
        }

        await AdController.show();

        puan += 100;
        dailyAds += 1;
        lastAd = now;

        tg.HapticFeedback.notificationOccurred("success");

        // GÜNLÜK GÖREV
        if(dailyAds >= 3){
            puan += 200;
            dailyAds = 0;
            alert("🎁 Günlük görev tamamlandı +200!");
        }

    }catch(e){
        console.log(e);
        status.innerText = "❌ Reklam hatası";
    }

    save();
    updateUI();
}

// SAVE
function save(){
    localStorage.setItem("puan", puan);
    localStorage.setItem("level", level);
    localStorage.setItem("clickValue", clickValue);
    localStorage.setItem("lastAd", lastAd);
    localStorage.setItem("dailyAds", dailyAds);
}

// UI
function updateUI(){
    document.getElementById("puan").innerText = puan;
    document.getElementById("level").innerText = "Level " + level;
}
</script>

</body>
</html>
